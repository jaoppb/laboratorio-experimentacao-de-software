[project]
name = "lab03"
version = "0.1.0"
description = "Lab03 - Mineração de métricas DORA em repositórios open-source"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.20.0",
    "httpx[http2]>=0.27.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "pyarrow>=15.0.0",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "statsmodels>=0.15.0",
    "tzdata>=2026.5",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
asyncio_mode = "auto"
