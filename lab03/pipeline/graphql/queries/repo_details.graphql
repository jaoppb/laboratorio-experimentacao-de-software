query GetRepoDetails($owner: String!, $name: String!, $after: String) {
  repository(owner: $owner, name: $name) {
    name
    stargazerCount
    createdAt
    primaryLanguage {
      name
    }
    defaultBranchRef {
      name
    }
    releases(first: 100, orderBy: {field: CREATED_AT, direction: DESC}, after: $after) {
      totalCount
      pageInfo {
        hasNextPage
        endCursor
      }
      nodes {
        tagName
        publishedAt
        isPrerelease
        isDraft
      }
    }
  }
}
