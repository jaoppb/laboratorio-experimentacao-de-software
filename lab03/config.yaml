# Configuração do Pipeline Lab03 - Mineração de Métricas DORA

# Janela de observação (12 meses = 365 dias = 52,14 semanas)
# Datas fixadas pelo grupo. `inicio` só com data vale 00:00:00Z; `fim` só com data vale o FIM do dia
# (2026-09-30 inclui até 2026-09-30T23:59:59.999999Z). Ver metricas/schemas.py::parse_window_end.
janela:
  inicio: "2025-10-01"
  fim: "2026-09-30"

# Critérios de inclusão mínima e tamanho da amostra
amostra:
  tamanho_final: 330
  min_releases: 5
  min_workflow_runs: 50

# Parâmetros para fatiamento de busca na Search API do GitHub
busca:
  min_stars: 1000
  qualificadores:
    - "archived:false"
    - "mirror:false"
    - "size:>1000"
  star_ranges:
    - ">10000"
    - "5001..10000"
    - "2501..5000"
    - "1501..2500"
    - "1000..1500"

# Variante (b) do CFR: versão da heurística de release corretiva (metricas/cfr_b.py::HEURISTICS).
# Trocar aqui pela versão final escolhida na avaliação contra o consenso (Issue #62).
cfr_b:
  heuristica: "v1"

# Diretórios de saída e cache local
diretorios:
  dados: "dados"
  cache: "cache"
  git_cache: "cache/git_repos"

# Política de limpeza do cache de clones Git superficiais
limpeza_git_cache: true

# Configurações de coleta de tags e deploys
coleta:
  # max_tags serve como salvaguarda da API REST em pipeline/releases.py (fetch_tags).
  # No pipeline principal (Stage 4), 100% das tags são extraídas diretamente do clone Git
  # bare local (git for-each-ref) com zero consumo de cota de API do GitHub.
  max_tags: 100

# Regeneração final (#56): repositórios que, se não puderem ser recoletados, mantêm os valores
# anteriores em vez de bloquear a publicação. `MadsLorentzen/ai-job-search` foi movido para
# `ai-job-search-dev/ai-job-search` e está desabilitado no GitHub (git clone falha).
regeneracao:
  manter_valores_anteriores:
    - "MadsLorentzen/ai-job-search"
