[project]
name = "lab05"
version = "0.1.0"
description = "Lab05 - Experimento Moodle 4.5 LTS vs 5.3 LTS: coleta, validação e auditoria"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.27",
    "numpy>=1.26",
]

[project.optional-dependencies]
axe = [
    "playwright>=1.45",
    "axe-playwright-python>=0.1.4",
]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["scripts"]
